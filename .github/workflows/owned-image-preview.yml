name: Owned AgentArts image preview
on:
  push:
    branches: [codex/agentarts-owned-image]
    paths:
      - 'apps/agentarts-runtime/**'
      - 'packages/agentarts/**'
      - 'packages/coordination/**'
      - 'packages/contracts/**'
      - 'packages/models/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/owned-image-preview.yml'
permissions:
  contents: read
  packages: write
jobs:
  publish-preview:
    if: github.actor == 'zemeng5208'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.12.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:owned-agent
      - name: Verify owned transport and orchestration before publishing
        run: node --test packages/contracts/test/agentarts-transport.test.mjs packages/agentarts/test/*.test.mjs apps/agentarts-runtime/test/*.test.mjs
      - name: Generate allowlist context
        id: context
        run: |
          node apps/agentarts-runtime/scripts/image-context.mjs > "$RUNNER_TEMP/image-context.json"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/image-context.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'directory='+c.context+'\n');"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ steps.context.outputs.directory }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/zemeng5208/personal-agent-owned:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/zemeng5208/PersonalAgent
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=AgentArts preview; unmerged; real cloud acceptance pending
      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'GHCR preview: `ghcr.io/zemeng5208/personal-agent-owned@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'This preview does not merge the PR or confirm Huawei cloud acceptance.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Export ARM64 image for repository collaborators
        env:
          IMAGE_REF: ghcr.io/zemeng5208/personal-agent-owned:sha-${{ github.sha }}
        run: |
          docker pull --platform linux/arm64 "$IMAGE_REF"
          docker save --output "$RUNNER_TEMP/personal-agent-owned-arm64.tar" "$IMAGE_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: owned-agentarts-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/personal-agent-owned-arm64.tar
          if-no-files-found: error
