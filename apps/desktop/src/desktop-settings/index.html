<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>PersonalAgent · 桌面设置</title><link rel="stylesheet" href="settings.css"></head>
<body><header><h1 data-i18n="title">桌面设置</h1><p data-i18n="intro">窗口、外观和本机诊断</p></header>
<main><form id="settings">
<label><span data-i18n="language">语言</span><select name="language"><option value="system">System / 跟随系统</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
<label><span data-i18n="theme">主题</span><select name="theme"><option value="system" data-i18n="system">跟随系统</option><option value="light" data-i18n="light">浅色</option><option value="dark" data-i18n="dark">深色</option></select></label>
<label><span data-i18n="font">设置页字体大小</span><select name="fontScale"><option value="0.9">90%</option><option value="1">100%</option><option value="1.1">110%</option><option value="1.2">120%</option><option value="1.3">130%</option></select></label>
<label><span data-i18n="calm">减少设置页动效</span><input name="calm" type="checkbox"></label>
<label><span data-i18n="top">悬浮入口始终置顶</span><input name="alwaysOnTop" type="checkbox"></label>
<label><span data-i18n="snap">拖动结束后贴近边缘吸附</span><input name="snap" type="checkbox"></label>
<label><span data-i18n="hover">靠近悬浮球展开面板</span><input name="hover" type="checkbox"></label>
<label><span data-i18n="shortcut">Ctrl+Shift+Space 显示悬浮球</span><input name="shortcut" type="checkbox"></label>
<button type="submit" data-i18n="save">保存</button><output id="status" role="status"></output>
</form>
<section><h2 data-i18n="windows">窗口与恢复</h2><p data-i18n="reloadWarning">重新加载会丢失该窗口未提交的输入。请先保存输入。</p><div id="windows"></div></section>
<section><h2 data-i18n="diagnostics">本机诊断</h2><p id="info"></p><button id="refresh" data-i18n="refresh">刷新</button> <button id="logs" data-i18n="logs">打开日志文件夹</button><pre id="log"></pre></section></main>
<script src="settings.js" type="module"></script></body></html>
